<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التحكم | Royal plast</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--red:#f21f1f;--cyan:#1ce1fc;--bg:#0b1220;--card:#121c30;--line:#22304a;--ink:#eef3fb;--mute:#93a0b8}
*{box-sizing:border-box}body{margin:0;font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header img{height:34px}header h1{font-size:17px;margin:0;flex:1;min-width:120px}
.w{max-width:1200px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
h2{margin:0 0 12px;font-size:17px}label{display:block;font-weight:700;font-size:13px;color:var(--mute);margin:10px 0 5px}
input,select{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font:inherit}
button{font:inherit;cursor:pointer;border:0;border-radius:11px;padding:9px 16px;font-weight:800;color:#fff;background:linear-gradient(110deg,var(--red),#ff4d2e)}
button.s{background:var(--line)}button.d{background:#7a1c1c}button.ok{background:#17a34a}button.sm{padding:5px 10px;font-size:12px;border-radius:9px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips label{display:flex;align-items:center;gap:6px;margin:0;padding:6px 12px;border:1px solid var(--line);border-radius:99px;color:var(--ink);cursor:pointer;font-size:13px}.chips input{width:auto;height:auto}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.m{color:var(--mute);font-size:13px}
#gate{max-width:360px;margin:15vh auto;text-align:center}
.pl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pi{background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;position:relative}
.pi img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#fff}
.pi .t{padding:8px;font-size:12px;line-height:1.4}.pi b{display:block;font-size:13px}.pi.h{opacity:.4}
.pi .n{position:absolute;top:6px;inset-inline-start:6px;background:rgba(0,0,0,.65);border-radius:8px;padding:1px 7px;font-size:11px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:16px}
.ov.on{display:flex}.ed{background:var(--card);border:1px solid var(--line);border-radius:18px;width:100%;max-width:900px;padding:18px;margin:auto}
.ims{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:8px}
.im{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px;text-align:center}
.im img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#fff}.im .row{justify-content:center;gap:5px;margin-top:6px}
.bar{position:sticky;bottom:0;background:var(--card);padding:10px 0 0;margin-top:14px;border-top:1px solid var(--line)}
.toast{position:fixed;bottom:16px;inset-inline-start:16px;background:#17a34a;color:#fff;padding:10px 16px;border-radius:12px;z-index:50;display:none}
</style></head><body>
<div id="gate" class="card"><img src="assets/logo.png" style="height:90px"><h2>لوحة تحكم الكتالوج</h2><input id="pin" type="password" placeholder="كلمة السر"><br><br><button id="enter">دخول</button><p class="m" id="gm"></p></div>
<div id="app" hidden>
<header><img src="assets/logo.png"><h1>لوحة التحكم <span class="m" id="cnt"></span></h1>
<button id="newp">+ منتج جديد</button><button class="ok" id="dl">تحميل الحزمة (ZIP)</button><a href="index.html" style="color:var(--cyan)">فتح الموقع ↗</a></header>
<div class="w">
<div class="card"><div class="row"><input id="fs" placeholder="بحث بالاسم أو الكود أو الحجم" style="max-width:300px"><select id="fc" style="max-width:160px"><option value="">كل الفئات</option><option value="bottle">زجاجات</option><option value="jar">برطمانات</option></select><span class="m">اضغط على أي منتج لتعديل اسمه وصوره ومواصفاته.</span></div></div>
<div class="pl" id="pl"></div>
<div class="card" style="margin-top:18px"><h2>حفظ ونشر التعديلات</h2><p class="m">كل تعديل بيتحفظ تلقائياً في المتصفح ده. لما تخلص دوس «تحميل الحزمة (ZIP)»، فك الضغط وارفع الملفات (products.json ومجلدي img و t) على GitHub فوق القديمة، والموقع بيتحدث لوحده.</p>
<div class="row"><button class="s" id="dj">تحميل products.json فقط</button><button class="d" id="rs">تجاهل التعديلات المحلية</button></div></div>
</div></div>

<div class="ov" id="ov"><div class="ed">
<div class="row" style="justify-content:space-between"><h2 id="et" style="margin:0"></h2><button class="s sm" id="cl">✕ إغلاق</button></div>
<div class="g">
<div><label>اسم المنتج (يظهر في الكتالوج، لو فاضي بيستخدم اسم الغطاء)</label><input id="e_name" placeholder="مثال: Pump Bottle"></div>
<div><label>الفئة</label><select id="e_cat"><option value="bottle">زجاجة</option><option value="jar">برطمان</option></select></div>
<div><label>الأحجام (مثال: 100, 250)</label><input id="e_sz"></div>
<div><label>الوحدة</label><select id="e_un"><option value="ML">مل / ML</option><option value="GM">جم / GM</option></select></div>
<div><label>النيك (مثال: 24, 28)</label><input id="e_nk"></div></div>
<label>نوع الغطاء</label><div class="chips" id="e_caps"></div>
<div class="g"><div><label>غطاء جديد (عربي)</label><input id="e_car"></div><div><label>اسمه بالإنجليزي</label><input id="e_cen"></div></div>
<label>الألوان</label><div class="chips" id="e_cols"><label><input type="checkbox" value="k"> أسود</label><label><input type="checkbox" value="w"> أبيض</label><label><input type="checkbox" value="c"> شفاف</label><label><input type="checkbox" value="o"> ألوان أخرى</label></div>
<div class="chips" style="margin-top:10px"><label><input type="checkbox" id="e_hq"> جودة عالية</label><label><input type="checkbox" id="e_mt"> ماط</label><label><input type="checkbox" id="e_hd"> مخفي عن الموقع</label></div>
<label>الصور</label><div class="ims" id="ims"></div>
<div class="row" style="margin-top:10px"><label class="s" style="margin:0;padding:9px 16px;border-radius:11px;background:var(--line);cursor:pointer;color:#fff">+ إضافة صور<input type="file" id="addf" accept="image/*" multiple hidden></label><span class="m" id="am"></span></div>
<div class="bar row"><button class="ok" id="sv">حفظ</button><button class="s" id="mg">دمج المنتج في منتج تاني</button><button class="d" id="dp">حذف المنتج</button></div>
</div></div>
<div class="toast" id="ts"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const PIN='royal2026';
const $=s=>document.querySelector(s);let D=null,NEWIMG={},KEY='rp_admin_draft',cur=null,E=null;
$('#gm').textContent='الحماية دي بسيطة ومش بديل لحماية الاستضافة. غيّر كلمة السر (PIN) من داخل admin.html.';
function login(){if($('#pin').value===PIN){$('#gate').hidden=true;$('#app').hidden=false;init()}else $('#gm').textContent='كلمة السر غلط'}
$('#enter').onclick=login;$('#pin').onkeydown=e=>{if(e.key=='Enter')login()};
const toast=m=>{const t=$('#ts');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2200)};
async function init(){let d=null;try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
 const live=await fetch('products.json?'+Date.now()).then(r=>r.json());
 if(d&&d.products&&d.products.length&&d.sig===live.products.length+':'+live.products[0].imgs[0]){D=d}else{D=live;D.sig=live.products.length+':'+live.products[0].imgs[0]}
 render()}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
const thumb=n=>NEWIMG[n]?NEWIMG[n].t:'t/'+n+'.webp';
function caps(){const m=new Map();D.products.forEach(p=>p.caps.forEach(c=>m.set(c.k,c)));return [...m.values()]}
function ttl(p){return p.name||p.caps.map(c=>c.en).join(' / ')||(p.cat=='jar'?'Jar':'Bottle')}
function render(){const q=$('#fs').value.trim().toLowerCase(),fc=$('#fc').value;
 const L=D.products.filter(p=>(!fc||p.cat==fc)&&(!q||(p.code+' '+ttl(p)+' '+p.sizes.map(s=>s.v+s.u).join(' ')+' '+p.necks.join(' ')).toLowerCase().includes(q)));
 $('#cnt').textContent='('+D.products.length+' منتج)';
 $('#pl').innerHTML=L.map(p=>`<div class="pi ${p.hidden?'h':''}" onclick="openE(${p.id})"><span class="n">${p.imgs.length} صور</span><img loading="lazy" src="${thumb(p.imgs[0])}"><div class="t"><b>${ttl(p)}</b>${p.code} · ${p.sizes.map(s=>s.v+s.u).join(', ')||'—'}${p.necks.length?' · NK'+p.necks.join('/'):''}</div></div>`).join('')}
$('#fs').oninput=render;$('#fc').onchange=render;
function openE(id){cur=id;const p=D.products.find(x=>x.id==id);E=JSON.parse(JSON.stringify(p));fill();$('#ov').classList.add('on')}
function fill(){const p=E;$('#et').textContent=p.code+' — '+ttl(p);$('#e_name').value=p.name||'';$('#e_cat').value=p.cat;
 $('#e_sz').value=p.sizes.map(s=>s.v).join(', ');$('#e_un').value=(p.sizes[0]||{u:'ML'}).u;$('#e_nk').value=p.necks.join(', ');
 const have=new Set(p.caps.map(c=>c.k));$('#e_caps').innerHTML=caps().map(c=>`<label><input type="checkbox" value="${c.k}" ${have.has(c.k)?'checked':''}> ${c.ar}</label>`).join('');
 document.querySelectorAll('#e_cols input').forEach(i=>i.checked=p.colors.includes(i.value));
 $('#e_hq').checked=!!p.hq;$('#e_mt').checked=!!p.matte;$('#e_hd').checked=!!p.hidden;$('#e_car').value='';$('#e_cen').value='';drawIms()}
function drawIms(){$('#ims').innerHTML=E.imgs.map((n,i)=>`<div class="im"><img src="${thumb(n)}"><div class="row"><button class="sm s" onclick="mv(${i},-1)">▶</button><button class="sm s" onclick="mv(${i},1)">◀</button></div><div class="row"><button class="sm s" onclick="first(${i})">رئيسية</button><button class="sm s" onclick="mto(${i})">نقل</button><button class="sm d" onclick="rm(${i})">حذف</button></div></div>`).join('')||'<span class="m">مفيش صور</span>'}
window.mv=(i,d)=>{const j=i+d;if(j<0||j>=E.imgs.length)return;[E.imgs[i],E.imgs[j]]=[E.imgs[j],E.imgs[i]];drawIms()};
window.first=i=>{const [x]=E.imgs.splice(i,1);E.imgs.unshift(x);drawIms()};
window.rm=i=>{if(confirm('إزالة الصورة دي من المنتج؟')){E.imgs.splice(i,1);drawIms()}};
window.mto=i=>{const code=prompt('اكتب كود المنتج اللي هتنقل له الصورة (مثال RP-012)، أو اكتب new لمنتج جديد');if(!code)return;
 const n=E.imgs[i];collect();
 if(code.trim().toLowerCase()=='new'){const id=Math.max(...D.products.map(p=>p.id))+1;const src=JSON.parse(JSON.stringify(E));src.id=id;src.code='RP-'+String(id).padStart(3,'0');src.imgs=[n];src.name='';D.products.push(src);toast('اتعمل منتج جديد '+src.code)}
 else{const t=D.products.find(p=>p.code.toLowerCase()==code.trim().toLowerCase());if(!t||t.id==cur){alert('الكود مش موجود');return}t.imgs.push(n);toast('اتنقلت إلى '+t.code)}
 E.imgs.splice(i,1);drawIms()};
function collect(){const p=E;p.name=$('#e_name').value.trim();p.cat=$('#e_cat').value;const u=$('#e_un').value;
 p.sizes=$('#e_sz').value.split(/[,،\s]+/).filter(Boolean).map(Number).filter(n=>n>0).map(v=>({v,u}));
 p.necks=$('#e_nk').value.split(/[,،\s]+/).filter(Boolean).map(Number).filter(n=>n>0);
 const ex=caps();p.caps=[...document.querySelectorAll('#e_caps input:checked')].map(i=>ex.find(c=>c.k==i.value));
 const ar=$('#e_car').value.trim();if(ar)p.caps.push({k:'x'+Date.now().toString(36),ar,en:$('#e_cen').value.trim()||ar});
 p.colors=[...document.querySelectorAll('#e_cols input:checked')].map(i=>i.value);p.hq=$('#e_hq').checked;p.matte=$('#e_mt').checked;p.hidden=$('#e_hd').checked;p.nospec=false}
function commit(){const i=D.products.findIndex(x=>x.id==cur);if(i>=0)D.products[i]=E}
$('#sv').onclick=()=>{collect();commit();persist();$('#ov').classList.remove('on');render();toast('اتحفظ ✔')};
$('#cl').onclick=()=>{$('#ov').classList.remove('on')};
$('#dp').onclick=()=>{if(confirm('حذف المنتج ده بكل صوره من القائمة؟')){D.products=D.products.filter(x=>x.id!=cur);persist();$('#ov').classList.remove('on');render()}};
$('#mg').onclick=()=>{const code=prompt('اكتب كود المنتج اللي هتدمج فيه كل الصور دي (مثال RP-012)');if(!code)return;
 const t=D.products.find(p=>p.code.toLowerCase()==code.trim().toLowerCase());if(!t||t.id==cur){alert('الكود مش موجود');return}
 t.imgs.push(...E.imgs);t.colors=[...new Set([...t.colors,...E.colors])];D.products=D.products.filter(x=>x.id!=cur);persist();$('#ov').classList.remove('on');render();toast('اتدمج في '+t.code)};
function toWebp(file,max,q){return new Promise(res=>{const im=new Image();im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>res(b),'image/webp',q)};im.src=URL.createObjectURL(file)})}
$('#addf').onchange=async e=>{$('#am').textContent='جاري التجهيز…';for(const f of e.target.files){const big=await toWebp(f,1080,.82),th=await toWebp(f,420,.76);
 const n='n'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);NEWIMG[n]={big,th,t:URL.createObjectURL(th)};E.imgs.push(n)}
 e.target.value='';$('#am').textContent='اتضافت ✔';drawIms()};
$('#newp').onclick=()=>{const id=Math.max(0,...D.products.map(p=>p.id))+1;const p={id,cat:'bottle',sizes:[],necks:[],caps:[],hq:false,matte:false,extra:[],colors:[],imgs:[],nospec:false,code:'RP-'+String(id).padStart(3,'0'),hidden:false,name:''};
 D.products.unshift(p);cur=id;E=JSON.parse(JSON.stringify(p));fill();$('#ov').classList.add('on')};
$('#cl').addEventListener('click',()=>{D.products=D.products.filter(p=>p.imgs.length||p.id!=cur||false);render()});
function clean(){const o=JSON.parse(JSON.stringify(D));delete o.sig;o.products=o.products.filter(p=>p.imgs.length);return o}
function dl(n,b){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()}
$('#dj').onclick=()=>dl('products.json',new Blob([JSON.stringify(clean())],{type:'application/json'}));
$('#dl').onclick=async()=>{const z=new JSZip();const o=clean();z.file('products.json',JSON.stringify(o));
 const used=new Set(o.products.flatMap(p=>p.imgs));
 for(const [n,x] of Object.entries(NEWIMG)){if(used.has(n)){z.file('img/'+n+'.webp',x.big);z.file('t/'+n+'.webp',x.th)}}
 dl('royalplast-update.zip',await z.generateAsync({type:'blob'}))};
$('#rs').onclick=()=>{if(confirm('تجاهل كل التعديلات المحلية والرجوع للنسخة المنشورة؟')){try{localStorage.removeItem(KEY)}catch(e){}NEWIMG={};init()}};
</script></body></html>
