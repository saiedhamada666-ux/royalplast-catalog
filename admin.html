<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التحكم | Royal plast</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--red:#f21f1f;--cyan:#1ce1fc;--bg:#0b1220;--card:#121c30;--line:#22304a;--ink:#eef3fb;--mute:#93a0b8}
*{box-sizing:border-box}body{margin:0;font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.w{max-width:1100px;margin:0 auto;padding:20px}header{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
header img{height:36px}header h1{font-size:18px;margin:0;flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:18px}
h2{margin:0 0 14px;font-size:18px}label{display:block;font-weight:700;font-size:13px;color:var(--mute);margin:10px 0 5px}
input,select,textarea{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font:inherit}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 20px;font-weight:800;color:#fff;background:linear-gradient(110deg,var(--red),#ff4d2e)}
button.s{background:var(--line)}button.d{background:#7a1c1c}button.ok{background:#17a34a}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips label{display:flex;align-items:center;gap:6px;margin:0;padding:7px 12px;border:1px solid var(--line);border-radius:99px;color:var(--ink);cursor:pointer}.chips input{width:auto;height:auto}
.pv{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.pv img{width:84px;height:84px;object-fit:cover;border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:start}td img{width:46px;height:46px;border-radius:8px;object-fit:cover}
.h{opacity:.4}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.m{color:var(--mute);font-size:13px}
#gate{max-width:360px;margin:15vh auto;text-align:center}
</style></head><body>
<div id="gate" class="card"><img src="assets/logo.png" style="height:90px"><h2>لوحة تحكم الكتالوج</h2><input id="pin" type="password" placeholder="كلمة السر"><br><br><button id="enter">دخول</button><p class="m" id="gm"></p></div>
<div id="app" hidden>
<header><img src="assets/logo.png"><h1>لوحة تحكم الكتالوج</h1><a href="index.html" style="color:var(--cyan)">فتح الموقع ↗</a></header>
<div class="w">
<div class="card"><h2>إضافة منتج جديد</h2>
<div class="g"><div><label>الفئة</label><select id="cat"><option value="bottle">زجاجة</option><option value="jar">برطمان</option></select></div>
<div><label>الأحجام (مثال: 100, 250)</label><input id="sz" placeholder="100, 250"></div>
<div><label>الوحدة</label><select id="un"><option value="ML">مل / ML</option><option value="GM">جم / GM</option></select></div>
<div><label>النيك (مثال: 24, 28)</label><input id="nk" placeholder="24"></div></div>
<label>نوع الغطاء</label><div class="chips" id="caps"></div>
<div class="g"><div><label>إضافة نوع غطاء جديد (عربي)</label><input id="cap_ar"></div><div><label>اسمه بالإنجليزي</label><input id="cap_en"></div></div>
<label>الألوان</label><div class="chips"><label><input type="checkbox" value="k"> أسود</label><label><input type="checkbox" value="w"> أبيض</label><label><input type="checkbox" value="c"> شفاف</label><label><input type="checkbox" value="o"> ألوان أخرى</label></div>
<div class="chips" style="margin-top:12px"><label><input type="checkbox" id="hq"> جودة عالية</label><label><input type="checkbox" id="mt"> ماط</label></div>
<label>صور المنتج (كل الصور لنفس المنتج)</label><input type="file" id="files" accept="image/*" multiple style="padding:8px;height:auto"><div class="pv" id="pv"></div>
<br><button id="add">إضافة المنتج</button> <span class="m" id="addmsg"></span></div>
<div class="card"><h2>المنتجات <span class="m" id="cnt"></span></h2><div class="row" style="margin-bottom:12px"><input id="fs" placeholder="بحث" style="max-width:260px"></div><div style="overflow:auto;max-height:520px"><table id="tb"></table></div></div>
<div class="card"><h2>حفظ ونشر التعديلات</h2><p class="m">التعديلات بتتحفظ مؤقتاً في المتصفح ده. دوس «تحميل الحزمة» هينزل ملف ZIP فيه products.json والصور الجديدة، وارفعهم على الموقع (GitHub / الاستضافة) فوق الملفات القديمة بنفس المسارات.</p>
<div class="row"><button class="ok" id="dl">تحميل الحزمة (ZIP)</button><button class="s" id="dj">تحميل products.json فقط</button><button class="d" id="rs">تجاهل التعديلات المحلية</button></div></div>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const PIN='royal2026';
const $=s=>document.querySelector(s);let D=null,NEWIMG={},KEY='rp_admin_draft';
$('#gm').textContent='كلمة السر الافتراضية متغيّرة من داخل الملف admin.html (ثابت PIN). الحماية دي بسيطة ومش بديل لحماية الاستضافة.';
function login(){if($('#pin').value===PIN){$('#gate').hidden=true;$('#app').hidden=false;init()}else $('#gm').textContent='كلمة السر غلط'}
$('#enter').onclick=login;$('#pin').onkeydown=e=>{if(e.key=='Enter')login()};
async function init(){let d=null;try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
 if(!d)d=await fetch('products.json?'+Date.now()).then(r=>r.json());D=d;render()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}render()}
function caps(){const m=new Map();D.products.forEach(p=>p.caps.forEach(c=>m.set(c.k,c)));return [...m.values()]}
function render(){$('#caps').innerHTML=caps().map(c=>`<label><input type="checkbox" value="${c.k}"> ${c.ar}</label>`).join('');
 const q=$('#fs').value.trim().toLowerCase();const L=D.products.filter(p=>!q||(p.code+JSON.stringify(p)).toLowerCase().includes(q));
 $('#cnt').textContent='('+D.products.length+')';
 $('#tb').innerHTML='<tr><th></th><th>الكود</th><th>الفئة</th><th>الأحجام</th><th>النيك</th><th>الغطاء</th><th></th></tr>'+L.map(p=>`<tr class="${p.hidden?'h':''}"><td><img src="${NEWIMG[p.imgs[0]]?NEWIMG[p.imgs[0]].t:'t/'+p.imgs[0]+'.webp'}"></td><td>${p.code}</td><td>${p.cat=='jar'?'برطمان':'زجاجة'}</td><td>${p.sizes.map(s=>s.v+s.u).join(', ')}</td><td>${p.necks.join(', ')}</td><td>${p.caps.map(c=>c.ar).join(', ')}</td><td><button class="s" onclick="tg(${p.id})">${p.hidden?'إظهار':'إخفاء'}</button> <button class="d" onclick="del(${p.id})">حذف</button></td></tr>`).join('')}
$('#fs').oninput=render;
window.tg=id=>{const p=D.products.find(x=>x.id==id);p.hidden=!p.hidden;save()};
window.del=id=>{if(confirm('حذف المنتج نهائياً من القائمة؟')){D.products=D.products.filter(x=>x.id!=id);save()}};
function toWebp(file,max,q){return new Promise(res=>{const im=new Image();im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>res(b),'image/webp',q)};im.src=URL.createObjectURL(file)})}
let pending=[];
$('#files').onchange=async e=>{pending=[];$('#pv').innerHTML='';for(const f of e.target.files){const big=await toWebp(f,900,.8),th=await toWebp(f,420,.76);pending.push({big,th});const i=document.createElement('img');i.src=URL.createObjectURL(th);$('#pv').appendChild(i)}};
$('#add').onclick=async()=>{
 const sizes=$('#sz').value.split(/[,،\s]+/).filter(Boolean).map(Number).filter(n=>n>0).map(v=>({v,u:$('#un').value}));
 const necks=$('#nk').value.split(/[,،\s]+/).filter(Boolean).map(Number).filter(n=>n>0);
 if(!pending.length){$('#addmsg').textContent='ضيف صورة واحدة على الأقل';return}
 const ex=caps();const sel=[...document.querySelectorAll('#caps input:checked')].map(i=>ex.find(c=>c.k==i.value));
 if($('#cap_ar').value.trim()){sel.push({k:'x'+Date.now().toString(36),ar:$('#cap_ar').value.trim(),en:$('#cap_en').value.trim()||$('#cap_ar').value.trim()})}
 const cols=[...document.querySelectorAll('.chips:nth-of-type(3) input:checked')].map(i=>i.value);
 const colors=[...document.querySelectorAll('input[type=checkbox][value=k],input[type=checkbox][value=w],input[type=checkbox][value=c],input[type=checkbox][value=o]')].filter(i=>i.checked&&!i.closest('#caps')).map(i=>i.value);
 const id=Math.max(0,...D.products.map(p=>p.id))+1;const imgs=[];
 pending.forEach((x,i)=>{const n='n'+id+'-'+(i+1);imgs.push(n);NEWIMG[n]={big:x.big,th:x.th,t:URL.createObjectURL(x.th)}});
 D.products.unshift({id,cat:$('#cat').value,sizes,necks,caps:sel,hq:$('#hq').checked,matte:$('#mt').checked,extra:[],colors,imgs,nospec:false,code:'RP-'+String(id).padStart(3,'0'),hidden:false});
 pending=[];$('#files').value='';$('#pv').innerHTML='';$('#addmsg').textContent='اتضاف ✔ (لسه محتاج تحميل الحزمة ورفعها)';save()};
$('#dj').onclick=()=>dl('products.json',new Blob([JSON.stringify(D)],{type:'application/json'}));
function dl(n,b){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()}
$('#dl').onclick=async()=>{const z=new JSZip();z.file('products.json',JSON.stringify(D));for(const [n,x] of Object.entries(NEWIMG)){z.file('img/'+n+'.webp',x.big);z.file('t/'+n+'.webp',x.th)}
 dl('royalplast-update.zip',await z.generateAsync({type:'blob'}))};
$('#rs').onclick=()=>{if(confirm('تجاهل كل التعديلات المحلية؟')){try{localStorage.removeItem(KEY)}catch(e){}NEWIMG={};init()}};
</script></body></html>
